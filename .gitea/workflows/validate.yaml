name: Brain Structural Validation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    name: Validate Markdown Structure & Links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python & Quality Tools
        run: |
          apt-get update -qq && apt-get install -y -qq python3 python3-pip
          pip3 install --break-system-packages ruff || pip3 install ruff
          npm install -g pyright

      - name: Run Brain Validator
        run: python3 scripts/validate-brain.py
